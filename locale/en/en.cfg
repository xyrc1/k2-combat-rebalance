[mod-setting-description]
xy-rebalance-pistol=Pistol fires 4/s instead of 3/s. Pistol magazines contain more ammo; 16 per magazine.
xy-rebalance-rifle=All rifle mags contain 20 rounds instead of 30. Uranium ammo is cheaper and deals more radiation damage (1 U238/mag). Imersite rounds deal less laser damage but retain their radiation damage, and are cheaper (1 imersite crystal/mag). Tank and car firerate 7.5/s > 10/s, but loses +25% damage bonus. Intended to make mid and late game gun turret defenses more reasonable and scale the price of mags back to a more vanilla-like state. A mild nerf to early game efficiency, but much improved late game DPS and efficiency.
xy-rebalance-combatbot=Makes higher tier bots only require 3 of the previous tier instead of 4. This is disabled by default as they are already pretty strong and only exists to encourage the player to use them.
xy-rebalance-flamethrower-turret-1=Flamethrower turret only accepts light oil as ammo and bonus damage removed. Projectile DPS 90/s > 60/s (most DPS comes from the applied fire effect/sticker; reduced to the same as handheld flamethrower). Fluid consumption increased by +100%. Space Exploration: Pyroflux still accepted as ammo for +40% extra damage. Generally designed to encourage using gun turrets instead of spamming flamethrowers for everything.
xy-rebalance-flamethrower-turret-2=Overrides stage 1. Locks flamethrower turret behind Metallurgic tech cards, require tungsten plates, and must be manfactured on Vulcanus. Increased projectile DPS. Projectiles predict target movement, similar to worms. Personal flamethrowers and vehicle flamethrowers used as normal. Unique flamethrower fuels may be added in the future.
xy-rebalance-grenade=For some reason, K2 buffs grenades to 100 damage. Tones down to damage to 75 but reduces the cost of a grenade by 20%. This also affects cluster grenades.
xy-rebalance-antimat=Removes the area of effect damage, and replaces it with piercing damage, and slightly increases damage. Piercing Power: Whenever an entity is hit by the projectile, this number gets reduced by the health of the entity. If the number is then below 0, the projectile is destroyed. This applies no actual changes to the anti-materiel rifle itself.
xy-rebalance-tank=Removes the +50% damage bonus on the heavy machine gun and laser cannon. Laser cannon shoots 33.3% slower. Still capable of obliterating literally everything.
xy-rebalance-poison-capsule=While already decently strong, grenades are also quite a bit stronger as well. Increases their damage per tick from 8 to 11, and increases their throwing range from 25 to 28.
xy-rebalance-impulse=Reduces damage from 500 to 450. Will need at least one laser damage upgrade to one shot big biters.
xy-rebalance-shotgun=Removes the 50% damage bonus both shotguns have. Buffs shotgun shell damage to 9 and piercing shotgun shell damage to 16. Will also buff shotgun turrets if any other mods add those.
xy-rebalance-nuke=Atomic bomb requires 30 U235 instead of 20. Nuclear artillery shell requires 20 U235 instead of 10.
xy-rebalance-equipment-solar=[item=solar-panel-equipment] 40 kW > 55 kW\n[item=kr-big-solar-panel-equipment] 192 kW > 264 kW\n[item=kr-superior-solar-panel-equipment] 80 kW > 120 kW\n[item=kr-big-superior-solar-panel-equipment]384 kW > 576kW\nStill entirely inferior to fuel-driven generators, but at least a little more competitive.
xy-rebalance-energy-shield=Spaced Out only: The HP reductions are NOT applied to MK3 and MK4 shields when Spaced Out is installed, and they recharge at 13/s and 16/s instead.\nSpace Exploration: This setting does nothing when Space Exploration is installed since it completely replaces Energy Shields anyway.\n[item=energy-shield-equipment] HP 50 > 60, Recharge 12/s > 8/s\n[item=energy-shield-mk2-equipment] HP 150 > 120, Recharge 12/s > 10s\n[item=kr-energy-shield-mk3-equipment]HP 200 > 180, Recharge 13.5/s > 12/s (power consumption 540 kW > 546 kW)\n[item=kr-energy-shield-mk4-equipment]HP 300 > 240, 16.2/s > 14/s (power consumption 810 kW > 800 kW)
;xy-rebalance-energy-shield-sa=[space-age]: MK3 and MK4 are more powerful when this setting is enabled due to being unlocked later in the game.\n[item=energy-shield-equipment] HP 50 > 60, Recharge 12/s > 8/s\n[item=energy-shield-mk2-equipment] HP 150 > 120, Recharge 12/s > 10s\n[item=kr-energy-shield-mk3-equipment] Recharge 13.5/s > 13/s (power consumption 540 kW > 546 kW)\n[item=kr-energy-shield-mk4-equipment] 16.2/s > 16/s (power consumption 810 kW > 800 kW)
xy-rebalance-spidertron=Adds an extra +500 HP to the Spidertron and buffs its rocket launchers from 0.67/s to 0.8/s (vanilla is 1/s). Increased explosion resistance to 80% to minimize self-damage.
xy-rebalance-teslagun=Buffs the tesla guns range from 24 > 32, firerate from 1/s > 3.75/s, and tesla ammo magazine size to 12. Has no effect on tesla turrets.
xy-rebalance-personal-laser=For some truly unknown reason, personal laser defenses deal 10x DPS and have multiple upgrades in K2, while only needing 4x the power. Reduces the base attack speed of all personal laser defenses from 10/s > 3/s. This also decreases their power consumption while active, but does not decrease their internal power buffer. Nerfs specifically MK4 Damage 60 > 45. Range only increases by +1 per tier instead of sporadically increasing. Reduces these down to a more vanilla-esque power level.
xy-rebalance-exoskeleton=[item=exoskeleton-equipment] Move speed +20% > +25%\n[item=kr-advanced-exoskeleton-equipment] Move speed +40% > +37.5%\n[item=kr-superior-exoskeleton-equipment] Move speed +60% > +50%\nDisabled by default as this can be seen as more quality of life related than combat. Mostly here just to give a slight bump to the first exoskeleton. It's not like you even need that much speed with quality anyway...
